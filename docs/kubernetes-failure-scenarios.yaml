# Apply these one at a time to a disposable test namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-k8s-agent-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-missing-env
  namespace: ai-k8s-agent-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: crashloop-missing-env }
  template:
    metadata: { labels: { app: crashloop-missing-env } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ["test -n \"$REQUIRED_DATABASE_URL\" || { echo REQUIRED_DATABASE_URL missing; exit 1; }"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagepull-wrong-tag
  namespace: ai-k8s-agent-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: imagepull-wrong-tag }
  template:
    metadata: { labels: { app: imagepull-wrong-tag } }
    spec:
      containers:
        - name: app
          image: busybox:tag-that-does-not-exist
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oomkilled-low-limit
  namespace: ai-k8s-agent-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: oomkilled-low-limit }
  template:
    metadata: { labels: { app: oomkilled-low-limit } }
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-c"]
          args: ["x = bytearray(256 * 1024 * 1024); import time; time.sleep(60)"]
          resources:
            limits: { memory: 32Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selector-mismatch
  namespace: ai-k8s-agent-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: selector-mismatch }
  template:
    metadata: { labels: { app: selector-mismatch } }
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: selector-mismatch
  namespace: ai-k8s-agent-test
spec:
  selector: { app: wrong-label }
  ports:
    - port: 80
      targetPort: 80
